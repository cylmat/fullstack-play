
networks:
    default:
        name: fs-api-network
        driver: bridge

services:

    #######
    # PHP #
    #######

    slim:
        container_name: fs-slim
        image: fs-php:latest
        restart: always
        user: 1000:1000
        environment:
            MYSQL_DSN: 'mysql://user:pass@mysql:3306/symfony?serverVersion=9.7'
            REDIS_DSN: 'redis://redis:6379/1'
        ports:
            - 8121:81   # api server
        command: sleep infinity
        volumes:
            - ./api:/var/www/application
        profiles:
          - api

