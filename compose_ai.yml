
networks:
    default:
        name: fs-ai-network
        driver: bridge

services:

    #######
    # AI #
    #######

    ai:
        container_name: fs-ai
        image: fs-php:latest
        restart: always
        user: 1000:1000
        environment:
            API_DSN: ''
        ports:
            - 8111:81   # ai server
        command: sleep infinity
        volumes:
            - ./ai:/var/www/application
        profiles:
          - ai
    
    node:
        container_name: fs-ai-node
        image: node:latest
        restart: always
        profiles:
          - ai

    mcp-filesystem:
        container_name: fs-ai-mcpfilesystem
        image: mcp/filesystem:latest
        restart: always
        profiles:
          - ai
