
networks:
    default:
        name: fs-ai-network
        driver: bridge

services:

    ######
    # AI #
    ######

    ai-node:
        container_name: fs-ai-node
        image: fs-node:latest
        user: 1000:1000
    #     environment:
    #         API_DSN: ''
        volumes:
            - ./ai:/var/www/application
            - .docker/config/keys:/var/www/application/config/keys:ro
            - .docker/config/ssh:/home/node/.ssh:ro
        ports:
            - 5111:5173
            - 5112:3000
        working_dir: /var/www/application
        command: sleep infinity
        depends_on:
            local-mcp-filesystem:
                condition: service_started
            mongo:
                condition: service_started
        profiles:
            - ai

    sftp:
        image: atmoz/sftp
        container_name: fs-ai-sftp
        ports:
            - "2222:22"
        volumes:
            - ./ai/data/files:/home/ftpuser/upload
            # allowed_keys automatic when keys are in ~/.ssh/keys directory
            - .docker/config/ssh/sftp-ftpuser_ed25519.pub:/home/ftpuser/.ssh/keys/sftp-ftpuser_ed25519.pub:ro
        command: ftpuser:change-moi:1001
        profiles:
            - ai

    # @doc https://github.com/njbrake/filesystem-mcp-server
    local-mcp-filesystem:
        image: ghcr.io/njbrake/filesystem-mcp-server:main
        container_name: fs-ai-mcpfilesystem
        ports: [8111:8123]
        volumes:
            - ./ai/data/files:/data
        profiles:
            - ai

    # @TODO github, draw.io
    # @doc https://mcpservers.org/fr/servers/lgazo/drawio-mcp-server

    # https://github.com/docker-library/mongo
    # mongodb-atlas-local:7
    # use mongodb-atlas-local to enable "document.createSearchIndex" command
    # connect with mongosh -u root -p root --authenticationDatabase admin --eval 'db.getSiblingDB("AIdatabase").documentsRag.getSearchIndexes()'
    mongo:
        image: mongodb/mongodb-atlas-local:latest
        container_name: fs-ai-mongo
        hostname: mongo
        environment:
            MONGODB_INITDB_ROOT_USERNAME: root
            MONGODB_INITDB_ROOT_PASSWORD: root
            MONGODB_LOAD_SAMPLE_DATA: false
        volumes:
            # initialize scripts
            - ./ai/data/mongo-init:/docker-entrypoint-initdb.d:ro
        ports:
        - 27111:27017
        profiles:
            - ai
            - ai-db

