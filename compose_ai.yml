
networks:
    default:
        name: fs-ai-network
        driver: bridge

services:

    #######
    # AI #
    #######

    ai-node:
        # image: node:latest
        container_name: fs-ai-node
        image: fs-node:latest
        user: 1000:1000
    #     environment:
    #         API_DSN: ''
        volumes:
            - ./ai:/var/www/application
            - ./.docker/config/keys:/var/www/application/config/keys
        ports:
            - 5111:5173
            - 5112:3000
        working_dir: /var/www/application
        command: sleep infinity
        profiles:
            - ai

    # @doc https://github.com/njbrake/filesystem-mcp-server
    local-mcp-filesystem:
        image: ghcr.io/njbrake/filesystem-mcp-server:main
        container_name: fs-ai-mcpfilesystem
        ports: [8111:8123]
        volumes:
            - ./ai/data:/data
        profiles:
            - ai


    # https://hub.docker.com/categories/machine-learning-and-ai
    # https://hub.docker.com/r/mcp/filesystem

