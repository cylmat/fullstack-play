
networks:
    default:
        name: fs-archi-network
        driver: bridge

services:

    #########
    # ARCHI #
    #########

    app:
        container_name: fs-archi-app
        image: fs-php:latest
        restart: always
        user: 1000:1000
        environment:
            MYSQL_DSN: ''
            REDIS_DSN: ''
        ports:
            - 8111:81   # symfony server
        command: sleep infinity
        volumes:
            - ./archi:/var/www/application
        profiles:
          - archi

    # kube https://kind.sigs.k8s.io/
    # actually: v1.37
    kind:
        container_name: fs-archi-kind
        image: kindest/node:latest
        restart: always
        user: 1000:1000
        environment:
            MYSQL_DSN: ''
            REDIS_DSN: ''
        ports:
            - 8111:81   # symfony server
        command: sleep infinity
        volumes:
            - ./archi:/var/www/application
        profiles:
          - archi

    cicd:
        container_name: fs-archi-cicd
        image: ubuntu