;;; HEAVY ones ;;;
; extension=swoole.so

;;;;;;;;;;;;;;;;;;;;;;;
;;; PECL Extensions ;;;
;;;;;;;;;;;;;;;;;;;;;;;

extension=apcu.so
extension=ast.so
extension=ds.so
extension=mcrypt.so
; extension=psr.so # careful can conflict with symfony cache


;;; Databases ;;;

extension=redis.so
;extension=memcached.so

;;; Coverage and debug ;;;

;extension=pcov.so
;extension=xhprof.so
zend_extension=/usr/local/lib/php/extensions/no-debug-non-zts-20240924/xdebug.so

;;; Heavy ones ;;;

extension=memcached.so
extension=phalcon.so
extension=swoole.so

;;;;;;;;;
;;; Resource Limits ;;;

memory_limit = 1G
max_execution_time = 30

; [sqlite3]
; Directory pointing to SQLite3 extensions
; https://php.net/sqlite3.extension-dir
;sqlite3.extension_dir =

; [ODBC]
; https://php.net/odbc.default-db
;odbc.default_db    =  Not yet implemented