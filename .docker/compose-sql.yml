
# volumes:
#     mysql:

networks:
    default:
        name: fs-network
        driver: bridge

services:

    #############
    ### MYSQL ###
    #############

    # https://hub.docker.com/_/mysql
    mysql:
        image: mysql:9
        container_name: fs-mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: user
            MYSQL_PASSWORD: pass
            MYSQL_DATABASE: mydb
            MYSQL_TCP_PORT: 3306 # Mandatory 3306 for Adminer
        volumes:
            - ./data/mysql/init/:/docker-entrypoint-initdb.d/:ro
            # - ./data/config/mysql/my.cnf:/etc/mysql/my.cnf:ro
            # - ./data/config/mysql/conf.d/my-custom.cnf:/etc/mysql/conf.d/my-custom.cnf:ro
            # - mysql:/var/lib/mysql
        ports: [8804:3306]
        profiles:
          - db

    ### ADMIN ###

    # https://hub.docker.com/_/adminer
    adminer:
        image: adminer:5-standalone
        container_name: fs-adminer
        restart: always
        ports: [8884:8080]
        profiles:
          - db

    # phpmyadmin:
    #     image: phpmyadmin:5.0
    #     restart: always
    #     ports:
    #         - 8081:80
    #     environment:
    #         - PMA_ARBITRARY=1
    #     external_links:
    #         - mysql:mysql



    ################
    ### POSTGRES ###
    ################

    postgres:
        image: postgres:18
        container_name: fs-postgres
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: pass
            POSTGRES_DB: postdb
        ports:
            - 8805:5432
        # volumes:
        #     - postgres-v:/var/lib/postgresql/data
        profiles:
            - db
